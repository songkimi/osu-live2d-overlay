<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Live2D Overlay</title>
<style>
  /* 三层透明都要做到位，缺一个就会看到白底/黑底：
     ① 这里 body 透明  ② PIXI 的 backgroundAlpha=0  ③ C# 侧 WebView2.DefaultBackgroundColor=Transparent */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ★ 2026-09-23：这里原有两条"画面上的字"——顶部常驻的黄色诊断条 #diag 和
     底部会淡出的状态行 #status。两条都撤掉了，原因见下面 log()/fail()/fatal() 的说明。
     现在这个页面**只有一个元素**：画布上的角色。 */
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script src="vendor/pixi.min.js"></script>
<script src="vendor/live2dcubismcore.min.js"></script>
<script>
  // Live2D Cubism Core 是 Live2D 官方的专有授权文件，不能随仓库一起分发，
  // 所以 clone 下来的人本地是缺这个文件的。这里补一层兜底：
  // 本地没取到就从官方 CDN 取 —— 必须在这一行就绪，因为下面的 pixi-live2d-display 依赖它。
  if (!window.Live2DCubismCore) {
    document.write('<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"><\/script>');
  }
</script>
<script src="vendor/pixi-live2d-display.cubism4.min.js"></script>

<script>
  // ============================================================
  // 插件页面：不做任何"演示"的事，完全由 C# 侧的消息驱动
  //   C# → JS：{type:"init", modelUrl, idle, view, expressionDurationMs, debug, voice}
  //            {type:"layers", persistent:[{id, params}]}   ← 常驻层（页面就绪时下发一次）
  //            {type:"scene", scene:"Playing"}              ← 界面切换（只通知，不规定怎么表现）
  //            {type:"steady", expression, params}          ← 常态层（连击区间变化时）
  //            {type:"combo", expression, params, combo, step}
  //            {type:"miss",  expression, params, combo}
  //            {type:"voice", emotion, reason}        ← 语音：和上面几条完全平级、互不依赖
  //            {type:"view",  view:{zoom,offsetY,offsetX}}
  //            {type:"idle"}
  //   JS → C#：{type:"log", text}  {type:"ready"}  {type:"error", text}
  //            {type:"fatal", text}   ← 页面画不出东西了（宿主该把它显示给自己那个窗口看）
  // ============================================================
  const canvas = document.getElementById("canvas");

  let app = null;
  let model = null;
  let baseScale = 1;
  let idleGroup = "Idle";
  let expressionDurationMs = 1500;

  // 上一次做过"渲染自检"的那个界面。
  // ★ 2026-09-20：它**只在界面真的切换时做一次**，不是每条 scene 消息都做 —— 见 applyScene 里的说明。
  let lastDiagScene = null;

  // init 处理完了没有。
  // ★ 2026-09-23 新增：渲染自检**必须等它之后**才跑。
  //   起因是真机日志里出现过一次"补丁没生效、表情 0 个"的**假警报** ——
  //   那一次自检跑在 init 之前（模型文件已经加载、但补丁注册的表情还没进来），
  //   于是量到的是一份"半初始化"的模型。这种假警报最坑：会把人带去查一个不存在的毛病。
  let initialized = false;

  let rendererName = "?";

  // 当前生效的"角色站位"。zoom / offsetX / offsetY 的语义来自全局视图参数（老配置的迁移来源），
  // 界面感知接管之后由每个界面自己的"站位"覆盖；angle 是每界面独立的角度（单位：度）。
  const view = { zoom: 1, offsetY: 0, offsetX: 0, angle: 0 };

  function post(obj) {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(obj);
  }

  /** 调试模式（C# 侧配置项「调试模式」）：开启后才做那些"只有排查时才值得做"的事（如渲染自检） */
  let debugMode = false;

  // ------------------------------------------------------------
  // 页面往外说话的三个口子 —— **一条都不显示在画面上**
  //
  // ★ 2026-09-23（用户要求："现在有日志了，可以取消掉悬浮窗的弹幕提示了"）
  //
  //   原来这里有四条路：底部会淡出的状态行、顶部常驻的黄色诊断条、模型看不见时画的绿方块，
  //   以及"写在日志里"这一条。前三条全撤了，只剩日志。为什么：
  //     ① 悬浮窗是**盖在游戏上**的。玩家在打歌，画面上一行字就是挡视线；
  //        而"出错时看一眼"这个场景本来就不成立 —— 真出错的时候人都在别处。
  //     ② 日志信息更全（内存里最近 500 条 + 调试模式下写文件），**能回溯**；
  //        画面上那一闪，错过了就没了，也没法发给别人看。
  //     ③ 出了问题该去的地方是设置界面的「日志」和「配置体检」，不是让角色旁边飘一行字。
  //   注意：**只是不显示**，每条照样 post 给 C# 侧写进日志。
  //
  //   唯一的例外是 fatal()：那种情况屏幕上**本来什么都没有**（模型没加载出来），
  //   所以宿主（设置窗口的预览区）会把这句话显示在自己那个提示行上 ——
  //   不显示在画面里，而是显示在"用户正看着的那个窗口"里。
  // ------------------------------------------------------------

  /** 一般信息（页面干了什么、拿到了什么）：进日志 */
  function log(text) { post({ type: "log", text: text }); }

  /**
   * 开发期错误：进日志，C# 侧记成「页面错误：…」。
   *
   * 为什么不显示：像"某个表情这一瞬间没播出来"这种情况，多半是游戏结算/断连击的瞬时竞态，
   * 玩家本来察觉不到；画面上弹出来反而像程序出错。
   */
  function fail(text) { post({ type: "error", text: text }); }

  /**
   * 页面**画不出东西**了（模型没加载成功、缺 Cubism Core 之类）。
   * 与 fail 的区别是"后果"：fail 是某一次没做成，fatal 是这一屏永远是空的。
   * 所以宿主会把它显示给自己那个窗口（悬浮窗没地方显示，就只进日志）。
   */
  function fatal(text) { post({ type: "fatal", text: text }); }

  // ---------------- 语音（和表情完全解耦：表情管"演什么"，语音管"说什么"） ----------------

  let voiceEnabled = false;
  let voiceProblem = "";                       // 配错了的原因（进日志，不在画面上说）
  let voiceVolume = 0.8;
  let voiceMinIntervalMs = 300;
  const voiceMoods = {};                       // 情绪名 → { pool:[地址…], bag:[洗好的袋] }
  const voiceAudios = {};                      // 地址 → 预加载好的 <audio>
  let voiceLastUrl = null;                     // 上一句播的是哪个（用来避免连着重复）
  let voiceLastDesc = "";                      // 上一句的描述（进日志）
  let voiceLastAt = 0;
  let voiceCurrent = null;
  let voiceFileProblem = "";                   // 有文件取不到时的说明（真问题，进日志）
  let voiceFailNotified = false;                // 第一次播放失败已提示过（避免刷屏）

  /**
   * 建立"情绪 → 文件"表，并把文件**全部预加载**。
   * 为什么要预加载：50 连击那一瞬间再去读文件会有一两百毫秒的延迟，
   * 语音会晚于表情出现，听感上就是"卡了一下"。
   */
  function setupVoice(cfg) {
    voiceEnabled = !!(cfg && cfg.enabled);
    voiceProblem = (cfg && cfg.problem) || "";

    if (!voiceEnabled) {
      voiceLastDesc = voiceProblem ? "未启用（" + voiceProblem + "）" : "未启用";
      log("语音未启用" + (voiceProblem ? "：" + voiceProblem : ""));
      return;
    }

    voiceVolume = typeof cfg.volume === "number" ? cfg.volume : 0.8;
    voiceMinIntervalMs = cfg.minIntervalMs || 0;

    (cfg.emotions || []).forEach(function (e) {
      const urls = (e.urls || []).filter(Boolean);
      if (!urls.length) return;
      voiceMoods[e.name] = { pool: urls, bag: [] };
      urls.forEach(function (u) {
        const a = new Audio(u);
        a.preload = "auto";                    // 先把数据取回来，播的时候才不用等
        a.volume = voiceVolume;
        voiceAudios[u] = a;
      });
    });

    voiceLastDesc = "还没播过";
    log("语音就绪：" + Object.keys(voiceMoods)
      .map(function (k) { return k + "(" + voiceMoods[k].pool.length + ")"; })
      .join("、"));

    // 再逐个取一遍，确认文件真的拿得到。
    // 为什么非要单独查一次：文件取不到和浏览器不让播，报出来的错很像，
    //   分开查能把"路径/编码问题"和"自动播放策略问题"一次分清楚。
    const all = [];
    Object.keys(voiceMoods).forEach(function (k) {
      voiceMoods[k].pool.forEach(function (u) { all.push(u); });
    });
    Promise.all(all.map(function (u) {
      return fetch(u).then(function (r) { return r.ok ? "" : voiceFileName(u) + "(" + r.status + ")"; })
                      .catch(function () { return voiceFileName(u) + "(取不到)"; });
    })).then(function (bad) {
      const failed = bad.filter(Boolean);
      log("语音文件检查：" + (all.length - failed.length) + "/" + all.length + " 可取到" +
               (failed.length ? "；失败：" + failed.join("、") : ""));
      voiceFileProblem = failed.length ? ("有 " + failed.length + " 个文件取不到：" + failed.join("、")) : "";
    });
  }

  /**
   * 挑一句话。用"洗牌袋"而不是每次直接随机：
   *   直接 Math.random() 有个反直觉的地方 —— 只有 2 句时，连续两次挑到同一句的概率是 50%，
   *   听感上就是"随机坏了，怎么老说同一句"。
   *   洗牌袋 = 把这一情绪的文件打乱、依次取，取完再打乱。既随机，又保证一轮之内不重复。
   */
  function pickVoiceUrl(emotion) {
    const m = voiceMoods[emotion];
    if (!m) return null;

    if (m.bag.length === 0) {
      m.bag = m.pool.slice();
      for (let i = m.bag.length - 1; i > 0; i--) {          // Fisher–Yates 洗牌
        const j = Math.floor(Math.random() * (i + 1));
        const t = m.bag[i]; m.bag[i] = m.bag[j]; m.bag[j] = t;
      }
      // 这一袋里第一个要播的（从末尾取）如果恰好是上一句，就跟别的位置换一下
      if (m.bag.length > 1 && m.bag[m.bag.length - 1] === voiceLastUrl) {
        const j = Math.floor(Math.random() * m.bag.length);
        const t = m.bag[m.bag.length - 1];
        m.bag[m.bag.length - 1] = m.bag[j];
        m.bag[j] = t;
      }
    }
    return m.bag.pop();
  }

  /** 地址 → 文件名（只为日志好读） */
  function voiceFileName(url) {
    const s = String(url).split("?")[0].split("/").pop() || "";
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  function playVoice(emotion, reason) {
    if (!voiceEnabled) return;

    const url = pickVoiceUrl(emotion);
    if (!url) { log("没有这类情绪的语音：" + emotion); return; }

    const now = performance.now();
    if (now - voiceLastAt < voiceMinIntervalMs) {
      log("间隔太短，跳过一句：" + emotion);
      return;
    }
    voiceLastAt = now;

    // 打断策略：新的一句直接掐掉上一句，嘴也跟着闭上。
    // 断连击的语音必须立刻出声，等上一句"说完"就晚了（后面还要接着打歌）。
    if (voiceCurrent) {
      try { voiceCurrent.pause(); voiceCurrent.currentTime = 0; } catch (e) { /* 忽略 */ }
      stopMouth();
    }

    const audio = voiceAudios[url] || (voiceAudios[url] = new Audio(url));
    audio.volume = voiceVolume;
    voiceCurrent = audio;
    voiceLastUrl = url;
    voiceLastDesc = emotion + "/" + voiceFileName(url);

    const p = audio.play();
    if (p && p.catch) {
      p.then(function () {
         log("语音播放：" + voiceLastDesc + (reason ? "（" + reason + "）" : ""));
         startMouth(audio);          // 一边出声一边张嘴
       })
       .catch(function (err) {
         // 走到这里基本只有一个原因：浏览器不允许"没有用户手势"的自动播放。
         // 插件已经用 --autoplay-policy=no-user-gesture-required 处理过了，真出现就是环境问题。
         const detail = "语音没能播放：" + err.name + " —— " + voiceLastDesc +
                        "（浏览器拒绝了自动播放）";
         // 只报**一次**：这句错误是"每说一句都失败"，全记下来会把日志里别的信息挤掉
         //（内存里只留最近 500 条 —— 刷屏就等于把出问题那一刻的现场冲掉了）。
         if (!voiceFailNotified) {
           voiceFailNotified = true;
           fail(detail + "｜之后不再重复记");
         }
       });
    }
  }

  /** 语音那一行（进日志）—— 整行用「｜」串起来，不留换行 */
  function voiceInfo() {
    if (!voiceEnabled) return voiceLastDesc || "未启用";
    const parts = Object.keys(voiceMoods).map(function (k) {
      return k + "(" + voiceMoods[k].pool.length + ")";
    });
    return parts.join("、") + "｜上一句 " + voiceLastDesc +
           (voiceFileProblem ? "｜⚠ " + voiceFileProblem : "");
  }

  // ---------------- 口型（说话时张嘴） ----------------
  //
  // 让"说话"看起来像说话：音频在播的这段时间里，驱动模型的口型参数开合。
  //
  // 时机（这点必须对，否则白设）：库的每帧更新顺序是
  //   动作 → 表情 → 眨眼 → 目光 → 物理 → 姿势 → 此处 → coreModel.update()
  // 所以要在 beforeModelUpdate 里写参数 —— 此时别人的值都已写完、还没提交，
  // 我们写的值会生效，也不会被动作或物理覆盖。

  let mouthEnabled = false;
  let mouthParamId = "";
  let mouthStrength = 1;
  let mouthUntil = 0;          // 说到什么时刻为止
  let mouthTarget = 0;         // 当前目标开合度
  let mouthNext = 0;           // 下次换目标的时刻
  let mouthValue = 0;          // 平滑后的实际值
  let mouthActive = false;     // 是否正在"接管"嘴巴（不接管时一帧都不碰这个参数）

  // 候选参数名：Cubism 规范里口型参数就叫 ParamMouthOpenY，个别模型会自己改名
  const MOUTH_PARAM_CANDIDATES = ["ParamMouthOpenY", "ParamMouthOpen", "MouthOpenY", "ParamMouthY"];

  function coreModel() {
    return model && model.internalModel ? model.internalModel.coreModel : null;
  }

  /**
   * 参数在不在模型里。
   * 只能拿名字一个个问，不能"列出所有参数再筛"：查过这个库的源码，
   *   CubismModel 有 getParameterCount / getParameterIndex / setParameterValueById，
   *   但**没有** getParameterId(index) —— 枚举不出来（getParameterIds() 属于眨眼控制器，不是模型的）。
   */
  function parameterExists(cm, id) {
    try { return typeof cm.getParameterIndex === "function" && cm.getParameterIndex(id) >= 0; }
    catch (e) { return false; }
  }

  function parameterCount(cm) {
    try { return typeof cm.getParameterCount === "function" ? cm.getParameterCount() : 0; }
    catch (e) { return 0; }
  }

  /** 找口型参数：配置里指定的优先，否则按常见命名挨个问 */
  function setupMouth(cfg) {
    mouthEnabled = !!(cfg && cfg.enabled);
    if (!mouthEnabled) { log("口型未启用"); return; }

    mouthStrength = typeof cfg.strength === "number" ? cfg.strength : 1;

    const cm = coreModel();
    if (!cm) { mouthEnabled = false; log("拿不到模型，口型不启用"); return; }

    const wanted = (cfg.parameter || "").trim();

    if (wanted) {
      mouthParamId = wanted;
      if (!parameterExists(cm, wanted))
        log("配置的口型参数「" + wanted + "」不在模型里，设了也不会有反应 —— 检查有没有打错");
    } else {
      mouthParamId = MOUTH_PARAM_CANDIDATES.find(function (id) { return parameterExists(cm, id); }) || "";
      if (!mouthParamId) {
        // 这个模型就是没有口型参数 → 安静地不做，别打扰（可在配置里手动指定「口型.参数」）
        mouthEnabled = false;
        log("模型里没有找到口型参数，说话时不会张嘴（该模型共 " + parameterCount(cm) + " 个参数）");
        return;
      }
    }

    log("口型参数 = " + mouthParamId + "，幅度 " + mouthStrength);
  }

  /** 开始"说话"：按音频时长决定说到什么时候 */
  function startMouth(audio) {
    if (!mouthEnabled) return;
    const seconds = (audio && isFinite(audio.duration) && audio.duration > 0) ? audio.duration : 1.2;
    mouthUntil = performance.now() + seconds * 1000 + 80;   // 留一点尾巴，别把最后一个字吃掉
    mouthNext = 0;                                          // 立刻开始动
    mouthActive = true;
  }

  /** 收口：不再延长，让 mouthTick 把嘴平滑闭上后自己收工 */
  function stopMouth() {
    mouthUntil = 0;
  }

  /** 每帧调一次：开 → 闭 → 开 …… 像说话，而不是机械的正弦波 */
  function mouthTick() {
    if (!mouthEnabled || !mouthParamId || !mouthActive) return;
    const cm = coreModel();
    if (!cm) return;

    const now = performance.now();

    if (now > mouthUntil) {
      mouthTarget = 0;
    } else if (now > mouthNext) {
      // 张嘴（久一点）和闭嘴（短一点）交替，读起来才像音节
      mouthTarget = mouthTarget > 0.15 ? 0.05 : (0.45 + Math.random() * 0.55);
      mouthNext = now + (mouthTarget > 0.15 ? 70 + Math.random() * 90 : 40 + Math.random() * 70);
    }

    mouthValue += (mouthTarget - mouthValue) * 0.35;        // 平滑一下，避免每帧跳变
    try { cm.setParameterValueById(mouthParamId, mouthValue * mouthStrength, 1); }
    catch (e) { /* 参数不存在等情况：忽略，不影响别的功能 */ }

    // 说完了、嘴也闭合到位 → 收工。
    // 这一步很重要：如果不"收工"而是继续每帧设值，就会把模型待机动作里
    //   本来就有的嘴部动画一路按成 0，角色会显得嘴僵住。
    if (now > mouthUntil && mouthValue < 0.02) {
      mouthActive = false;
      log("口型结束，参数交还给动作");
    }
  }

  // ---------------- 初始化 ----------------

  window.chrome.webview.addEventListener("message", async (event) => {
    const msg = event.data;
    if (!msg || !msg.type) return;

    switch (msg.type) {
      case "init":
        try {
          idleGroup = msg.idle || "Idle";
          expressionDurationMs = msg.expressionDurationMs || 1500;
          debugMode = msg.debug === true;
          if (msg.view) Object.assign(view, msg.view);
          setupVoice(msg.voice);
          await loadModel(msg.modelUrl);
          setupMouth(msg.mouth);      // 要在模型加载完之后：口型参数是从模型里找出来的

          // 表情层合成和口型挂在同一个钩子上：
          //   此刻库的 动作/表情/眨眼/目光/物理/姿势 都已经写完参数、还没提交，
          //   我们写的值会生效，也不会被它们覆盖。
          //   口型排在后面 —— 说话时嘴必须听口型的，不能被表情层按回去。
          model.internalModel.on("beforeModelUpdate", function () {
            composeLayers();
            mouthTick();
          });
          if (msg.persistent) setPersistent(msg.persistent);
          initialized = true;      // 自检要等这一句之后才跑（见 applyScene 里的说明）
        } catch (e) {
          // 模型没加载出来 = 这一屏永远是空的 → fatal：宿主会把这句话显示在自己窗口的提示行上
          fatal("模型加载失败：" + e.message);
        }
        break;

      case "combo":
        log("收到 combo 消息：" + msg.expression);
        playInstant(msg.expression, msg.params, expressionDurationMs);
        break;

      case "miss":
        log("收到 miss 消息：" + msg.expression);
        playInstant(msg.expression, msg.params, expressionDurationMs);
        break;

      // 区间变化 → 换常态层。它不过期，一直挂着直到区间再变；
      // 瞬时层退场后它自己就浮出来了，不需要谁来"恢复上一个表情"。
      case "steady":
        setSteady(msg.expression, msg.params);
        break;

      // 常驻层：整批替换（页面刚就绪、或者配置变了）
      case "layers":
        setPersistent(msg.persistent);
        break;

      // 界面切换：MainMenu / SongSelect / Playing / Result / Unknown
      //
      // 服务运行时每切一次界面就发一条，带四样东西：
      //   scene     —— 现在在哪（只记日志，表现看下面三项）
      //   show      —— 这个界面要不要显示角色（配置里"启用"才算数）
      //   opacity   —— 角色该多透明（0 = 看不见）。**和 show 不是一回事**：
      //                show=false 是"这个界面不显示角色"，
      //                opacity=0 是"角色还在、位置也没动，只是暂时看不见"
      //                （谱面加载期间就是这么用的，歌一开始就恢复成 1）
      //   character —— 角色站位（相对画布的比例位置 + 缩放），不显示时是 null
      case "scene":
        log("界面 → " + msg.scene + (msg.show === false ? "（不显示角色）" : "（显示角色）") +
                 (typeof msg.opacity === "number" ? "，透明度 " + msg.opacity : ""));
        applyScene(msg);
        break;

      // 动作：和表情是两条独立的消息，页面这边各播各的
      case "motion":
        playMotion(msg.action);
        break;

      // 试播（设置界面「行为」页点清单里的一行）→ 走**瞬时层**，播完自己回落。
      // ★ 2026-09-23 用户拍板："动作和表情都只是暂时播放" ——
      //   所以这里和 combo/miss 走完全同一条路，没有"挂住不放"的那种模式。
      case "expression":
        log("试播表情 → " + msg.expression);
        playInstant(msg.expression, msg.params, expressionDurationMs);
        break;
      // 语音：只认情绪，不认表情 —— 这就是"语音与动作解耦"在协议上的样子
      case "voice":
        playVoice(msg.emotion, msg.reason);
        break;

      case "view":
        if (msg.view) { Object.assign(view, msg.view); applyView(); }
        break;

      case "idle":
        playIdle();
        break;

      // 目光跟随鼠标：坐标由 C# 侧提供（窗口点击穿透，WebView2 收不到鼠标事件）
      case "cursor":
        if (model && typeof msg.x === "number") model.focus(msg.x, msg.y);
        break;

      // ★ 2026-09-23：`case "status"`（C# 让页面显示一行提示）撤掉了 —— 见 log() 上面那段说明。
    }
  });

  /** 画布尺寸：用 clientWidth（CSS 实际尺寸），并保证不为 0 */
  function readCanvasSize() {
    const w = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth || 0));
    const h = Math.max(1, Math.round(canvas.clientHeight || window.innerHeight || 0));
    canvas.width = w;
    canvas.height = h;
    return { w: w, h: h };
  }

  /** 等到画布有真实尺寸再开始（初始化时窗口可能还没布局完成，尺寸会是 0） */
  /**
   * 等到画布有真实尺寸再开始（初始化时窗口可能还没布局完成，尺寸会是 0）。
   * 等的过程**不往画面上写东西**（以前会写"等待画布尺寸 …"）：等到了就什么都不用说，
   * 一直等不到才报一次 —— 报的是结果，不是过程。
   */
  async function waitForCanvasSize() {
    for (let i = 0; i < 50; i++) {                 // 最多等 5 秒
      const s = readCanvasSize();
      if (s.w > 50 && s.h > 50) return s;
      await new Promise(r => setTimeout(r, 100));
    }

    const s = readCanvasSize();
    fail("画布等了 5 秒还是 " + s.w + "×" + s.h + " —— 按这个尺寸继续（角色可能显示不全）");
    return s;
  }

  async function loadModel(url) {
    // Cubism Core 不随仓库分发（授权），本地缺文件时靠上面那层 CDN 兜底。
    // 两边都没取到的话，这里给一句能看懂的提示，而不是让它静静地加载失败。
    if (!window.Live2DCubismCore) {
      fatal("缺少 Live2D Cubism Core：请把 live2dcubismcore.min.js 放到 web/vendor/ 下" +
            "（本地和官方 CDN 都没取到）—— 见 README「需要你自己准备的东西」");
      return;
    }

    const size = await waitForCanvasSize();

    app = new PIXI.Application({
      view: canvas,
      width: size.w,
      height: size.h,
      backgroundAlpha: 0,      // 透明背景的关键之一
      antialias: true,
      autoStart: true
    });

    rendererName = app.renderer.name || (String(app.renderer.type) === "1" ? "webgl" : "canvas");

    model = await PIXI.live2d.Live2DModel.from(url);
    app.stage.addChild(model);

    recomputeBaseScale();
    applyView();
    playIdle();

    // 尺寸变化时自动纠正
    new ResizeObserver(() => {
      if (!app) return;
      const s = readCanvasSize();
      app.renderer.resize(s.w, s.h);
      applyView();
    }).observe(document.body);

    // 兜底自愈：布局尺寸晚一点才稳定时，逐帧检查画布尺寸，变了就重算一次
    let lastW = app.renderer.width, lastH = app.renderer.height, stableFrames = 0;
    app.ticker.add(() => {
      if (!model) return;
      if (app.renderer.width !== lastW || app.renderer.height !== lastH) {
        lastW = app.renderer.width; lastH = app.renderer.height;
        applyView();
        stableFrames = 0;
      } else if (stableFrames < 3) {
        // 前几帧再补一次，确保首帧尺寸就是对的
        stableFrames++;
        applyView();
      }
    });

    post({ type: "ready" });
  }

  function recomputeBaseScale() {
    if (!model || !app) return;
    const m = modelSize();
    baseScale = Math.min(app.renderer.width / m.w, app.renderer.height / m.h);
  }

  /**
   * 取模型的**原始画布尺寸**。
   * 注意：不能用 model.width —— PIXI 的 width 是"含缩放"的属性（scale × 局部尺寸），
   * 模型一旦被缩放过，再读它就是缩放后的值，用来算适配比例会得出错误结果。
   * internalModel.width/height 才是模型自己的画布尺寸（不受缩放影响）。
   */
  function modelSize() {
    const im = model && model.internalModel;
    return {
      w: (im && im.width) || model.width || 1,
      h: (im && im.height) || model.height || 1
    };
  }

  /** 检查 WebGL 到底能不能用 —— Live2D 必须有 WebGL 才能画出来 */
  function webglInfo() {
    try {
      const c = document.createElement("canvas");
      const gl = c.getContext("webgl2") || c.getContext("webgl");
      if (!gl) return "不可用 ✗";
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      const name = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "可用";
      return String(name).slice(0, 46);
    } catch (e) {
      return "异常：" + e.message;
    }
  }

  /**
   * 诊断文本：出问题时这一行字就能定位到具体是哪一层的问题。
   *
   * ★ 2026-09-23：它原来自带一套显示（顶部黄条 + 模型看不见时画个绿方块 = "看得到它 → 渲染正常"）。
   *   显示撤了，**内容留着** —— 现在由渲染自检把它写进日志（见 applyScene）。
   *   绿方块那套说法的替代品更直接：`renderSelfCheck()` 会数**非透明像素**，
   *   "有没有画出来"这个问题它用数字回答，不用再靠"人眼看方块"。
   */
  function diagnostics() {
    if (!app || !model) return null;

    const m = modelSize();
    const info = modelPatchInfo();
    const s = baseScale * view.zoom;

    // 模型占了画面哪一块：**按旋转后的范围算**。
    // 加了角度之后不能再拿 model.x / y 当左上角来算 —— 那两个现在是"脚底中心"的位置，
    // 而且转过之后模型占的宽高也变了。这里按"绕脚底中心旋转"自己算包围盒，不依赖库。
    const rad = (view.angle || 0) * Math.PI / 180;
    const cosA = Math.abs(Math.cos(rad)), sinA = Math.abs(Math.sin(rad));
    const boxW = m.w * s * cosA + m.h * s * sinA;
    const boxH = m.w * s * sinA + m.h * s * cosA;
    const left = Math.round(model.x - boxW / 2);
    const top = Math.round(model.y - boxH);
    const right = Math.round(model.x + boxW / 2);
    const bottom = Math.round(model.y);
    const visible = bottom > 0 && top < app.renderer.height && right > 0 && left < app.renderer.width;

    // 多行会占满日志页好几行，所以统一用「｜」串成一整行 —— 一条日志 = 一次判断的全部依据
    let text =
      "画布 " + app.renderer.width + "×" + app.renderer.height + "｜渲染器 " + rendererName +
      "｜模型(原始) " + Math.round(m.w) + "×" + Math.round(m.h) +
      "｜缩放 " + view.zoom.toFixed(2) + "（基准 " + baseScale.toFixed(4) + "）｜上下 " + view.offsetY.toFixed(2) +
      "｜角度 " + (view.angle || 0).toFixed(0) + "°" +
      "｜模型范围 (" + left + "," + top + ")→(" + right + "," + bottom + ")｜在画面内 = " + visible +
      "｜补丁检查：动作组 [" + info.groups.join("、") + "]｜表情 " + info.defs.length + " 个" +
      (info.defs.length ? "：" + info.defs.slice(0, 4).join("、") + (info.defs.length > 4 ? "…" : "")
                        : " ← ⚠ 补丁没生效（应为 17 个）") +
      "｜语音：" + voiceInfo() +
      "｜WebGL：" + webglInfo();

    // 把"所以呢"也写在同一行里 —— 日志里最该看清的就是结论
    if (!visible) text += "｜⚠ 模型不在画面内（站位参数或窗口尺寸？）";
    else if (info.defs.length === 0) text += "｜⚠ 补丁没生效（虚拟主机映射或请求拦截有问题）";

    return text;
  }

  // ---------------- 视图（位置与大小由配置控制） ----------------

  function applyView() {
    if (!model || !app) return;
    const w = app.renderer.width, h = app.renderer.height;

    // 每次都按"当前"的模型原始尺寸与画布尺寸重新算适配比例 —— 永不过期、自动纠正
    recomputeBaseScale();

    const m = modelSize();
    const s = baseScale * view.zoom;

    // 旋转轴心挪到**脚底中心**：角色像站在地上转身 —— 脚不动，上半身转。
    // PIXI 默认绕模型的左上角转，那样一转角色就甩出画面了，所以这个 pivot 必须设。
    // 注意它换掉的是"位置的含义"：设了 pivot 之后，model.x / y 定位的就是这个点
    // （脚底中心），不再是左上角 —— 下面两行的算法因此也跟着换了一套。
    model.pivot.set(m.w / 2, m.h);

    model.scale.set(s, s);
    model.rotation = (view.angle || 0) * Math.PI / 180;   // 配置里是度，PIXI 要弧度

    model.x = w / 2 + view.offsetX * w;                   // 脚底中心放在画布水平中线（+偏移）
    model.y = h + view.offsetY * h;                       // 脚底贴画布底边（+偏移）
  }

  // ---------------- 渲染自检（排查用） ----------------

  /**
   * 把"模型到底画出来没有"变成一句话，发回 C# 写进日志 —— 省得为了看一眼诊断条反复跑游戏。
   *
   * 最有分量的是最后那项：**直接从渲染结果里数非透明像素**。
   *   数出来是 0   → 模型真的一个像素都没画出来（渲染 / 纹理那一层的问题）
   *   数出来大于 0 → 模型是画出来了的，看不见就属于窗口合成那一层
   * 这两种情况的修法完全不同，所以必须先把它分开。
   */
  function renderSelfCheck() {
    try {
      const m = modelSize();
      const s = baseScale * view.zoom;
      const b = model.getBounds();
      return "alpha=" + model.alpha +
             " 缩放=" + model.scale.x.toFixed(4) +
             " 位置=(" + Math.round(model.x) + "," + Math.round(model.y) + ")" +
             " 显示尺寸=" + Math.round(m.w * s) + "x" + Math.round(m.h * s) +
             " 包围盒=(" + Math.round(b.x) + "," + Math.round(b.y) + ") " +
             Math.round(b.width) + "x" + Math.round(b.height) +
             "｜舞台节点=" + app.stage.children.length +
             "｜贴图=" + (model.internalModel && model.internalModel.textures
                            ? model.internalModel.textures.length + " 张（模型定义里是 4 张）"
                            : "?") +
             "｜" + opaquePixelCheck();
    } catch (e) {
      return "自检失败：" + e.message;
    }
  }

  /** 从渲染结果里数非透明像素：0 = 模型什么都没画出来 */
  function opaquePixelCheck() {
    try {
      if (!app.renderer.extract) return "无 extract 插件";
      const px = app.renderer.extract.pixels(model);
      const m = modelSize();
      const W = Math.max(1, Math.round(m.w)), H = Math.max(1, Math.round(m.h));

      // 数非透明像素，同时记住它们落在哪个范围里 ——
      // "有像素但只挤在很小一块"和"铺满整个画布"是两种完全不同的病。
      let count = 0, minX = W, minY = H, maxX = -1, maxY = -1;
      for (let y = 0; y < H; y += 2) {
        const row = y * W;
        for (let x = 0; x < W; x += 2) {
          if (px[(row + x) * 4 + 3] > 0) {
            count++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const total = px.length / 4;
      const spread = maxX < 0
        ? "（一个都没找到）"
        : "分布在 (" + minX + "," + minY + ")→(" + maxX + "," + maxY + ")" +
          " 占原始画布 " + (100 * (maxX - minX + 1) / W).toFixed(0) + "%×" +
          (100 * (maxY - minY + 1) / H).toFixed(0) + "%";
      return "非透明像素 " + count + "/" + total + "（每 4 个采 1 个）" + spread +
             "｜WebGL=" + webglInfo();
    } catch (e) {
      return "像素提取失败：" + e.message;
    }
  }

  // ---------------- 界面感知（每个界面一份档位） ----------------

  /**
   * 应用一条 scene 消息：该显示就显示、并摆到这一档的站位；不该显示就藏起来。
   *
   * 站位的语义和 view 完全一致（x / y 是相对画布宽高的比例，scale 是缩放倍数，angle 是角度），
   * 所以这里直接写进 view 再调 applyView() —— 位置算法只留一份，不重复实现。
   */
  function applyScene(msg) {
    if (!model || !app) return;

    const show = msg.show !== false;      // 没带这个字段 = 显示（兼容老消息）

    // 透明度：**由 C# 那边算好送过来**（0 = 完全看不见，1 = 完全看得见）。
    // 它和 show 是两件事，别混：
    //   show=false   —— 这个界面压根不显示角色（没启用 / 认不出的界面）
    //   opacity=0    —— 角色**还在**，只是暂时看不见（谱面加载期间就是这么用的）
    // 后者不动位置、不卸载模型，歌一开始 C# 把 opacity 发回 1 就恢复 ——
    // 所以加载那两秒人物既不会乱跳，也不是"消失了像是坏了"。
    // 没带这个字段 = 按 show 推（兼容老消息）。
    const opacity = (typeof msg.opacity === "number")
      ? msg.opacity
      : (show ? 1 : 0);

    model.visible = show;
    model.alpha = opacity;

    if (show && msg.character) {
      view.zoom = msg.character.scale;
      view.offsetX = msg.character.x;
      view.offsetY = msg.character.y;
      view.angle = msg.character.angle || 0;    // 每界面独立的角度（度）
      applyView();
    }

    // 排查用：应用完之后到底"是什么状态"。看不见角色时，这一行能区分
    //   visible=false（消息要它藏）／opacity=0（透明的，加载期就是这种）／
    //   scale=NaN（缩放算坏了）／位置跑到画布外（摆位错了）
    const m0 = modelSize();
    log("场景应用：" + msg.scene + " show=" + show + " opacity=" + opacity +
             " character=" + JSON.stringify(msg.character) +
             "｜visible=" + model.visible +
             " alpha=" + model.alpha +
             " zoom=" + view.zoom +
             " scale=" + model.scale.x +
             " 位置=(" + Math.round(model.x) + "," + Math.round(model.y) + ")" +
             " 画布=" + app.renderer.width + "x" + app.renderer.height +
             " 模型原始=" + Math.round(m0.w) + "x" + Math.round(m0.h));

    // 排查用：立刻采一次，2 秒后再采一次。
    // 贴图是异步上传到 GPU 的，"刚切过去"和"过两秒"这两组数据一对比，
    // 就能区分是"模型真的没画出来"还是"还没加载完" —— 这两者的修法完全不同。
    // 渲染自检**只在调试模式下跑**（像素采样要把整张画布走一遍，玩家版每次切界面都做纯属浪费）。
    //
    // ★ 2026-09-21：**画面快照（把画布导成 PNG 发回 C#）整个撤掉了。**
    //   它当初是排查"角色看不见"的利器（一张图就能分清"没画出来"和"画了但没上屏"），
    //   而那个问题已经查清并修掉了。留着的代价反而实在：
    //   一次编码约 270KB、要往日志/磁盘写，还极易把帧率拖垮（见下）。
    //   判断"画出来没有"现在靠 `renderSelfCheck()` 里那个**数非透明像素**的那一行 ——
    //   同一件事、不写文件、只回一行字。
    //
    // ★★ 2026-09-20 修：**只在界面真的切换时做，不是每条 scene 消息都做。**
    //   以前这里是"每条 scene 消息都跑"，而**设置界面的预览区每拖一下滑块就发一条 scene**
    //   → 每拖一下做一次全画布像素扫描（3200 万像素）+ 一次 PNG 编码，
    //   帧率直接掉到 **5 帧**，日志也被 base64 图片撑到 **34MB**（用户真机实测）。
    //   而这件事要回答的问题本来就是"**刚切过去那一下**角色画出来了没有" ——
    //   同一个界面里改站位、改尺寸，根本不需要再自检一遍。
    if (debugMode && initialized && msg.scene !== lastDiagScene) {
      lastDiagScene = msg.scene;

      // 两行、回答两个不同的问题：
      //   ① "画出来没有" → 数非透明像素（`renderSelfCheck`）
      //   ② "参数是什么" → 尺寸/站位/补丁/语音/WebGL（`diagnostics`，原诊断条那一套）
      log("渲染自检（" + msg.scene + "，立刻）：" + renderSelfCheck());
      const d = diagnostics();
      if (d) log("渲染参数（" + msg.scene + "）：" + d);

      setTimeout(function () {
        try {
          log("渲染自检（" + msg.scene + "，2 秒后）：" + renderSelfCheck());
        } catch (e) {
          log("自检失败：" + e.message);
        }
      }, 2000);
    }
  }

  // ---------------- 动作与表情 ----------------

  function playIdle() {
    // 配置里没填待机动作（idle 为空）就别调了 —— 否则每次表情结束都会失败一次，
    // 对"只想先跑起来"的人来说全是噪音。
    if (!idleGroup) return;
    try { model.motion(idleGroup); log("待机动作（循环）"); }
    catch (e) { fail("待机动作失败：" + e.message); }
  }

  /** 模型里实际注册了什么（用来判断"打补丁"到底成没成功） */
  function modelPatchInfo() {
    const mm = model.internalModel.motionManager;
    const groups = Object.keys(mm.definitions || {}).map(k => k + "(" + (mm.definitions[k] || []).length + ")");
    const em = mm.expressionManager;
    const defs = em && em.definitions ? em.definitions.map(d => d.Name || d.name) : [];
    return { groups: groups, defs: defs };
  }

  // ---------------- 表情：三层参数合成 ----------------
  //
  // 为什么不再用 model.expression()：
  //   库的 expressionManager 只有**一个槽位** —— 挂上新表情会把旧的卸掉。
  //   可模型这边并不冲突：绒绒的 17 个表情各改一个独立参数，完全可以同时开着。
  //   挡路的是库的槽位设计，不是模型。
  //
  // 所以"谁能和谁同时存在"改由**层**来管，按"能活多久"分三种：
  //   常驻 persistent —— 用户勾的形象元素（鞋子、高光…），一直在
  //   常态 steady     —— 连击区间决定，跟着区间换
  //   瞬时 instant    —— 阈值触发，到期淡出
  //
  // 每帧在 beforeModelUpdate 里按 常驻 → 常态 → 瞬时 各应用一遍。
  //   这个顺序只对 Overwrite 型的参数有意义（Add 是加法，先后无所谓）。

  const FADE_IN_MS = 160;      // 一层淡入用多久
  const FADE_OUT_MS = 240;     // 淡出比淡入慢一点：撤掉时不那么突兀
  const LAYER_ORDER = { persistent: 0, steady: 1, instant: 2 };

  /** 所有活着的表现单元（含正在淡出的） */
  let units = [];
  let lastComposeAt = 0;

  /**
   * 造一个表现单元 —— "把一份参数表挂上去，并且管着它的生死"。
   * @param kind   persistent / steady / instant
   * @param id     标识，只用于日志和诊断
   * @param params exp3 的参数表 [{ id, value, blend }]，由 C# 侧读好下发
   * @param ttlMs  活多久（0 = 不过期）
   */
  function makeUnit(kind, id, params, ttlMs) {
    return {
      kind: kind,
      id: id,
      params: params || [],
      weight: 0,                                   // 从 0 淡入
      target: 1,                                   // 1 = 活着，0 = 正在退场
      dieAt: ttlMs > 0 ? performance.now() + ttlMs : 0
    };
  }

  function isAlive(kind, id) {
    return units.some(function (u) { return u.kind === kind && u.id === id && u.target === 1; });
  }

  /** 让某一类里活着的单元退场（淡出，不是立刻消失）。keepId 留着不动。 */
  function retire(kind, keepId) {
    for (const u of units) {
      if (u.kind === kind && u.target === 1 && u.id !== keepId) u.target = 0;
    }
  }

  /**
   * 把一个表情挂到某一层上。
   *
   * 同一个表情如果已经在这一层上（活着的、或者还在淡出的），就**复用那个单元**：
   *   从它当前的权重继续往上爬，绝不新建第二个。
   * 为什么必须这样：断连击时常是"同一个表情被连着触发"，如果每次都新建一份，
   *   两份 exp3 会在同一帧都往上加 → 参数值翻倍（Add 型会被钳到上限、其它型会失真），
   *   而且新单元从权重 0 重新淡入，看起来就是中途闪一下。
   */
  function activate(kind, id, params, ttlMs) {
    for (const u of units) {
      if (u.kind === kind && u.id === id) {
        u.target = 1;                                   // 淡出到一半的，原路爬回去
        u.params = params || u.params;
        u.dieAt = ttlMs > 0 ? performance.now() + ttlMs : 0;
        return u;
      }
    }
    const u = makeUnit(kind, id, params, ttlMs);
    units.push(u);
    return u;
  }

  /** 常驻层：整批替换 */
  function setPersistent(list) {
    const items = list || [];
    const wanted = items.map(function (it) { return it.id; });
    for (const u of units) {
      if (u.kind === "persistent" && u.target === 1 && wanted.indexOf(u.id) < 0) u.target = 0;
    }
    for (const it of items) activate("persistent", it.id, it.params, 0);
    log("常驻层 → " + (wanted.length ? wanted.join("、") : "（空）"));
  }

  /** 常态层：区间变了就换人（旧的淡出、新的淡入） */
  function setSteady(id, params) {
    if (!id) { retire("steady"); return; }
    if (isAlive("steady", id)) return;             // 还是同一个区间 → 什么都不做
    retire("steady", id);
    activate("steady", id, params, 0);
    log("常态层 → " + id);
  }

  /**
   * 瞬时层：阈值触发。
   * 同一个表情正在演就不重新淡入，只把到期时间往后推 ——
   *   这就是配置里「重复触发策略：保留正在播放」的意思，也顺手挡掉了
   *   "频繁失误时表情一闪一闪"。
   */
  function playInstant(id, params, ttlMs) {
    if (!id) return;
    const again = isAlive("instant", id);
    retire("instant", id);
    activate("instant", id, params, ttlMs);
    if (!again) log("瞬时层 → " + id);
  }

  /**
   * 把一份参数表写到模型上。
   *
   * 这几行是照抄库自己的做法（vendor 里 ExpressionMotion.doUpdateParameters）。
   * 照抄而不是自己发明，是因为：同一个 exp3，用库播和用我们播必须长得一样，
   * 否则每换一个模型就得重新调一遍。所以连它的脾气也照抄 ——
   *   ① Blend 只认 "Multiply" / "Overwrite" 两个字符串，
   *      其余（含 "Add"、含没写、含写错）一律按 Add 处理；
   *   ② 三个写入方法都带第三个参数 weight，库本来就支持"按权重混合"，
   *      所以淡入淡出不用自己插值，把重量从 0 爬到 1 就行。
   */
  function applyParams(cm, params, weight) {
    for (const p of params) {
      try {
        switch (p.blend) {
          case "Multiply":  cm.multiplyParameterValueById(p.id, p.value, weight); break;
          case "Overwrite": cm.setParameterValueById(p.id, p.value, weight); break;
          default:          cm.addParameterValueById(p.id, p.value, weight); break;
        }
      } catch (e) { /* 单个参数写不进去，不该拖累这一层的其它参数 */ }
    }
  }

  /** 每帧一次：推进权重 → 清掉退完的 → 从低层到高层应用 */
  function composeLayers() {
    const cm = coreModel();
    const now = performance.now();
    if (!cm || units.length === 0) { lastComposeAt = 0; return; }

    // 帧间隔得自己算（库的 beforeModelUpdate 钩子不带参数）。
    // 上限 100 毫秒：卡一下不该让权重一帧跳到底，那看起来就是"啪"地切过去。
    const dt = lastComposeAt ? Math.min(now - lastComposeAt, 100) : 16;
    lastComposeAt = now;

    const hadInstant = units.some(function (u) { return u.kind === "instant"; });

    for (const u of units) {
      if (u.dieAt > 0 && now > u.dieAt) u.target = 0;
      const diff = u.target - u.weight;
      const step = dt / (u.target === 1 ? FADE_IN_MS : FADE_OUT_MS);
      u.weight = Math.abs(diff) <= step ? u.target : u.weight + (diff > 0 ? step : -step);
    }

    units = units.filter(function (u) { return !(u.target === 0 && u.weight <= 0.001); });

    // 低层先写、高层后写 —— Overwrite 型的参数因此天然是"高层说了算"
    const order = units.slice().sort(function (a, b) {
      return LAYER_ORDER[a.kind] - LAYER_ORDER[b.kind];
    });
    for (const u of order) {
      if (u.weight > 0.001) applyParams(cm, u.params, u.weight);
    }

    // 瞬时层全退完了 → 让动作回到待机。
    //   动作和表情是解耦的两条线，但"什么时候该回待机"只有这里知道。
    if (hadInstant && !units.some(function (u) { return u.kind === "instant"; })) playIdle();
  }

  /** 动作（motion）：传进来的是标识，也就是"组名"——库会从这一组里随机挑一个播 */
  function playMotion(name) {
    if (!model || !name) return;
    try {
      model.motion(name);      // 随机挑一个变体是库自带的行为，我们不用管
      log("播放动作：" + name);
    } catch (e) {
      fail("动作播放失败：" + name + " → " + e.message);
    }
  }

  window.addEventListener("resize", () => {
    if (!app) return;
    const s = readCanvasSize();
    app.renderer.resize(s.w, s.h);
    recomputeBaseScale();
    applyView();
  });
</script>
</body>
